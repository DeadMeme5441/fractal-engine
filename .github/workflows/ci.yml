name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install Clojure CLI
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 -fsSLO https://download.clojure.org/install/linux-install-1.12.5.1654.sh
          chmod +x linux-install-1.12.5.1654.sh
          sudo ./linux-install-1.12.5.1654.sh
          clojure --version

      - name: Check whitespace
        run: git diff --check

      # The whole engine validates offline. This includes the pinned SCI sandbox
      # regression tests, snapshot/restore round trips, and namespace-graph
      # acyclicity. Re-run locally before pushing runtime changes.
      - name: Run engine tests
        run: clojure -M:test

      - name: Build library jar
        run: clojure -T:build jar

      - name: Build CLI uberjar
        run: clojure -T:build uber

      - name: Smoke-test CLI jar
        run: java -jar target/fractal.jar help
