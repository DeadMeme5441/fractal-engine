name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install Clojure CLI
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 -fsSLO https://download.clojure.org/install/linux-install-1.12.5.1654.sh
          chmod +x linux-install-1.12.5.1654.sh
          sudo ./linux-install-1.12.5.1654.sh
          clojure --version

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing fractal-engine $VERSION"

      - name: Check whitespace
        run: git diff --check

      - name: Run engine tests
        run: clojure -M:test

      - name: Build library jar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: clojure -T:build jar

      - name: Publish library to Clojars
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          clojure -X:deploy \
            :artifact "\"target/fractal-engine-${{ steps.version.outputs.value }}.jar\""

      - name: Build CLI uberjar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: clojure -T:build uber

      - name: Smoke-test CLI jar
        run: java -jar target/fractal.jar help

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/fractal.jar \
            --title "fractal-engine $GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
