name: release

# On every v* tag this workflow:
#   1. reruns the public validation suite,
#   2. publishes the thin library jar to Clojars when Clojars secrets are present,
#      using coordinate net.clojars.deadmeme5441/fractal-engine, and
#   3. builds the `fractal` CLI uberjar and attaches release assets to GitHub.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install Clojure CLI
        run: |
          curl -fsSL -O https://github.com/clojure/brew-install/releases/latest/download/posix-install.sh
          chmod +x posix-install.sh
          sudo ./posix-install.sh
          clojure --version

      - name: Derive version from tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V"

      - name: Check whitespace
        run: git diff --check

      - name: Run engine tests
        run: clojure -M:test

      - name: Run eval harness tests
        run: clojure -M:evals-test

      - name: Build library jar
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: clojure -T:build jar      # -> target/fractal-engine-<version>.jar

      - name: Stage library asset
        run: |
          mkdir -p release-assets
          cp "target/fractal-engine-${{ steps.ver.outputs.version }}.jar" release-assets/

      - name: Publish library to Clojars when configured
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          if [ -z "${CLOJARS_USERNAME:-}" ] || [ -z "${CLOJARS_PASSWORD:-}" ]; then
            echo "::notice::Skipping Clojars publish because CLOJARS_USERNAME/CLOJARS_PASSWORD are not configured."
            exit 0
          fi
          clojure -X:deploy \
            :artifact "\"target/fractal-engine-${{ steps.ver.outputs.version }}.jar\""

      - name: Build uberjar
        run: clojure -T:build uber      # -> target/fractal.jar

      - name: Smoke-test the jar
        run: java -jar target/fractal.jar help

      - name: Stage CLI asset
        run: cp target/fractal.jar release-assets/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/fractal.jar \
            "release-assets/fractal-engine-${{ steps.ver.outputs.version }}.jar" \
            --title "fractal-engine ${GITHUB_REF_NAME}" \
            --notes-from-tag \
            --verify-tag
